name: Build & Deploy Pages (temp replace url)
on:
  push:
    branches: [ main ] # 你的源码分支，是master就改成master
  workflow_dispatch: # 支持手动运行

jobs:
  build-and-deploy:
    runs-on: Windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run url replace script (only on working copy, NOT commit back)
        run: python test.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ # 把当前目录（已经替换好链接的html）发布出去
          publish_branch: gh-pages
